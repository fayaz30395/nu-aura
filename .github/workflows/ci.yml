name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # Backend Build & Test
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    # Postgres is provided by Testcontainers per test session — no `services:` block
    # needed for it. Redis IS required at context init by
    # tenantTimezoneInvalidateSubscriber (Redis pub/sub), so provide it as a
    # service container on localhost:6379 (matches application-test defaults).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install internal modules from infra/mvn-local-deps/
        run: |
          mvn install:install-file -Dfile=infra/mvn-local-deps/nulogic-platform-1.0.0.pom -DgroupId=com.nulogic -DartifactId=nulogic-platform -Dversion=1.0.0 -Dpackaging=pom
          mvn install:install-file -Dfile=infra/mvn-local-deps/common-module-1.0.0.jar -DpomFile=infra/mvn-local-deps/common-module-1.0.0.pom
          mvn install:install-file -Dfile=infra/mvn-local-deps/pm-module-1.0.0.jar -DpomFile=infra/mvn-local-deps/pm-module-1.0.0.pom

      - name: Build Backend
        working-directory: ./backend
        run: mvn clean compile -DskipTests

      - name: Run Backend Tests
        working-directory: ./backend
        run: mvn test
        env:
          SPRING_PROFILES_ACTIVE: test
          # Datasource URL/user/password are injected at runtime by
          # AbstractPostgresIntegrationTest via @DynamicPropertySource.
          TESTCONTAINERS_RYUK_DISABLED: 'false'

      - name: Generate coverage report
        working-directory: ./backend
        run: mvn jacoco:report -pl .

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  # Frontend Build & Test
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate API client (Orval, from committed OpenAPI snapshot)
        working-directory: ./frontend
        run: npm run api:generate
        env:
          # lib/generated/api is gitignored; regenerate from the committed
          # snapshot so tsc/build/Docker all see the typed client. Refresh the
          # snapshot via backend OpenApiSpecExportIT when the API surface changes.
          API_DOCS_URL: ./openapi-snapshot.json

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test:run

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.ci.nu-aura.local/api/v1
          NEXT_PUBLIC_ENABLE_WEBSOCKET: 'true'

  # Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [ backend ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This job duplicates the dedicated security-scan.yml workflow (Trivy image
      # + CodeQL + gitleaks), so keep it non-blocking — a transient Maven Central
      # 429 during fs dependency resolution must not fail the build pipeline.
      - name: Trivy CVE table (debug, non-blocking)
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          # Gate on CRITICAL only; HIGH reported via the table step + SARIF.
          severity: 'CRITICAL'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          scanners: 'vuln'  # secrets are gated by the dedicated gitleaks job

      - name: Upload Trivy scan results
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Docker Build (optional)
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: nulogic/hrms-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: nulogic/hrms-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.ci.nu-aura.local/api/v1
            NEXT_PUBLIC_ENABLE_WEBSOCKET=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
