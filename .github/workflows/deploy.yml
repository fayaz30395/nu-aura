name: Deploy

# T2-09: progressive delivery.
#   - push to main          → auto-runs build + deploy-staging (canary on cluster
#                             side if Argo Rollouts controller is installed and
#                             helm value `canary.enabled=true`)
#   - workflow_dispatch     → manual trigger for either env; prod requires the
#                             `production` GitHub Environment to grant approval
#                             via its required_reviewers protection rule.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]
      ref:
        description: 'Git ref to deploy (commit SHA or tag)'
        required: true
        default: 'main'

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  # On push events `inputs.*` is undefined — fall back to the pushed branch /
  # default 'staging' target so downstream jobs have non-empty strings.
  DEPLOY_REF: ${{ github.event.inputs.ref || github.ref_name }}
  DEPLOY_TARGET: ${{ github.event.inputs.target || 'staging' }}

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.images.outputs.backend }}
      frontend-image: ${{ steps.images.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Image tags
        id: images
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "backend=gcr.io/${GCP_PROJECT_ID}/nu-aura-backend:${SHA}" >> $GITHUB_OUTPUT
          echo "frontend=gcr.io/${GCP_PROJECT_ID}/nu-aura-frontend:${SHA}" >> $GITHUB_OUTPUT

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build + push backend
        run: |
          docker build -f backend/Dockerfile -t ${{ steps.images.outputs.backend }} .
          docker push ${{ steps.images.outputs.backend }}

      - name: Build + push frontend
        run: |
          docker build -f frontend/Dockerfile -t ${{ steps.images.outputs.frontend }} ./frontend
          docker push ${{ steps.images.outputs.frontend }}

  deploy-staging:
    name: Deploy → staging
    needs: build
    # Auto-runs on push-to-main; on workflow_dispatch only when target is
    # staging or production (production runs staging first as a smoke gate).
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'staging' || github.event.inputs.target == 'production' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.nu-aura.nulogic.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: GKE auth
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: nu-aura-staging
          location: ${{ env.GCP_REGION }}

      # T1-03: smoke-test the cosign signature before we hand the image to
      # Kyverno at admission time. Same identity/issuer as
      # infra/deployment/kyverno/require-image-signature.yaml — keep in sync.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Verify image signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for IMAGE in "${{ needs.build.outputs.backend-image }}" "${{ needs.build.outputs.frontend-image }}"; do
            echo "Verifying signature for ${IMAGE}"
            cosign verify \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/cosign-sign.yml@.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${IMAGE}"
          done

      - name: Helm upgrade staging
        run: |
          helm upgrade --install nu-aura infra/deployment/helm/hrms \
            --namespace nu-aura --create-namespace \
            --values infra/deployment/helm/hrms/values-staging.yaml \
            --set backend.image=${{ needs.build.outputs.backend-image }} \
            --set frontend.image=${{ needs.build.outputs.frontend-image }}

      # T2-09: green-light gate. Production is a manual workflow_dispatch with
      # GitHub Environment approval; this smoke confirms staging is healthy
      # before an operator clicks "Run workflow → production".
      - name: Smoke test /actuator/health
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl -sf https://staging.nu-aura.nulogic.com/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend /actuator/health = UP (attempt ${i})"
              exit 0
            fi
            echo "Health check pending (attempt ${i})..."
            sleep 15
          done
          echo "Smoke test FAILED — /actuator/health did not return UP within 5min"
          exit 1

  deploy-production:
    name: Deploy → production
    needs: deploy-staging
    # Prod NEVER auto-runs from push-to-main. Manual workflow_dispatch only,
    # AND the `production` environment below has required_reviewers configured
    # in GitHub repo settings as the second manual gate.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nu-aura.nulogic.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: GKE auth
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: nu-aura-prod
          location: ${{ env.GCP_REGION }}

      # T1-03: smoke-test the cosign signature before we hand the image to
      # Kyverno at admission time. Same identity/issuer as
      # infra/deployment/kyverno/require-image-signature.yaml — keep in sync.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Verify image signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for IMAGE in "${{ needs.build.outputs.backend-image }}" "${{ needs.build.outputs.frontend-image }}"; do
            echo "Verifying signature for ${IMAGE}"
            cosign verify \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/cosign-sign.yml@.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${IMAGE}"
          done

      - name: Helm upgrade production
        run: |
          helm upgrade --install nu-aura infra/deployment/helm/hrms \
            --namespace nu-aura --create-namespace \
            --values infra/deployment/helm/hrms/values-prod.yaml \
            --set backend.image=${{ needs.build.outputs.backend-image }} \
            --set frontend.image=${{ needs.build.outputs.frontend-image }}

      - name: Smoke test /actuator/health
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl -sf https://nu-aura.nulogic.com/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend /actuator/health = UP (attempt ${i})"
              exit 0
            fi
            echo "Health check pending (attempt ${i})..."
            sleep 15
          done
          echo "Smoke test FAILED — /actuator/health did not return UP within 5min"
          exit 1
