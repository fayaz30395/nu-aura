name: Deploy

# T2-09: progressive delivery.
#   - push to main          → auto-runs build + deploy-staging (canary on cluster
#                             side if Argo Rollouts controller is installed and
#                             helm value `canary.enabled=true`)
#   - workflow_dispatch     → manual trigger for either env; prod requires the
#                             `production` GitHub Environment to grant approval
#                             via its required_reviewers protection rule.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]
      ref:
        description: 'Git ref to deploy (commit SHA or tag)'
        required: true
        default: 'main'

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  # On push events `inputs.*` is undefined — fall back to the pushed branch /
  # default 'staging' target so downstream jobs have non-empty strings.
  DEPLOY_REF: ${{ github.event.inputs.ref || github.ref_name }}
  DEPLOY_TARGET: ${{ github.event.inputs.target || 'staging' }}
  FRONTEND_STAGING_API_URL: https://api.hrms-staging.nulogic.com/api/v1
  FRONTEND_PRODUCTION_API_URL: https://api.hrms.nulogic.com/api/v1

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.images.outputs.backend }}
      frontend-image: ${{ steps.images.outputs.frontend }}
      image-registry: ${{ steps.images.outputs.registry }}
      image-tag: ${{ steps.images.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Image tags
        id: images
        run: |
          SHA=$(git rev-parse --short HEAD)
          REGISTRY="gcr.io/${GCP_PROJECT_ID}"
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT
          echo "tag=${SHA}" >> $GITHUB_OUTPUT
          echo "backend=${REGISTRY}/hrms-backend:${SHA}" >> $GITHUB_OUTPUT
          echo "frontend=${REGISTRY}/hrms-frontend:${SHA}" >> $GITHUB_OUTPUT

      - name: Auth GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build + push backend
        run: |
          docker build -f backend/Dockerfile -t ${{ steps.images.outputs.backend }} .
          docker push ${{ steps.images.outputs.backend }}

      - name: Build + push frontend
        run: |
          FRONTEND_API_URL="${FRONTEND_STAGING_API_URL}"
          if [ "${DEPLOY_TARGET}" = "production" ]; then
            FRONTEND_API_URL="${FRONTEND_PRODUCTION_API_URL}"
          fi
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${FRONTEND_API_URL}" \
            --build-arg NEXT_PUBLIC_ENABLE_WEBSOCKET=true \
            -f frontend/Dockerfile \
            -t ${{ steps.images.outputs.frontend }} \
            ./frontend
          docker push ${{ steps.images.outputs.frontend }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Sign images
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.images.outputs.backend }}"
          cosign sign --yes "${{ steps.images.outputs.frontend }}"

  deploy-staging:
    name: Deploy → staging
    needs: build
    # Auto-runs on push-to-main; on workflow_dispatch only when target is
    # staging or production (production runs staging first as a smoke gate).
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'staging' || github.event.inputs.target == 'production' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.nu-aura.nulogic.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Auth GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: GKE auth
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: nu-aura-staging
          location: ${{ env.GCP_REGION }}

      # T1-03: smoke-test the cosign signature before we hand the image to
      # Kyverno at admission time. Same identity/issuer as
      # infra/deployment/kyverno/require-image-signature.yaml — keep in sync.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Verify image signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for IMAGE in "${{ needs.build.outputs.backend-image }}" "${{ needs.build.outputs.frontend-image }}"; do
            echo "Verifying signature for ${IMAGE}"
            cosign verify \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${IMAGE}"
          done

      - name: Prepare Helm prerequisites
        run: |
          set -euo pipefail
          kubectl create namespace hrms --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n hrms get secret hrms-secrets
          kubectl -n hrms get secret hrms-google-drive-credentials
          kubectl apply -f infra/deployment/kubernetes/configmap.yaml

      - name: Helm upgrade staging
        run: |
          helm upgrade --install nu-aura infra/deployment/helm/hrms \
            --namespace hrms \
            --values infra/deployment/helm/hrms/values-staging.yaml \
            --set imageRegistry=${{ needs.build.outputs.image-registry }} \
            --set backend.image.repository=hrms-backend \
            --set backend.image.tag=${{ needs.build.outputs.image-tag }} \
            --set frontend.image.repository=hrms-frontend \
            --set frontend.image.tag=${{ needs.build.outputs.image-tag }}

      # T2-09: green-light gate. Production is a manual workflow_dispatch with
      # GitHub Environment approval; this smoke confirms staging is healthy
      # before an operator clicks "Run workflow → production".
      - name: Smoke test /actuator/health
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl -sf https://staging.nu-aura.nulogic.com/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend /actuator/health = UP (attempt ${i})"
              exit 0
            fi
            echo "Health check pending (attempt ${i})..."
            sleep 15
          done
          echo "Smoke test FAILED — /actuator/health did not return UP within 5min"
          exit 1


  # ── WS-3 preproduction gate ────────────────────────────────────────────────
  # Production authorization behaviour cannot be exercised in production itself:
  # DEMO_CREDENTIALS_ENABLED=false there and no legitimate test credential exists,
  # so self-access / cross-employee / receipt / page-size checks were UNVERIFIED on
  # every release. These jobs run them for real against an isolated environment,
  # on the SAME artifact, before production promotion is allowed.
  verify-preproduction:
    name: Verify → preproduction
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: preproduction
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      PREPROD_BASE_URL: ${{ secrets.PREPROD_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      # The same artifact that build produced. Nothing is rebuilt between
      # verification and promotion, so what is verified is what ships.
      - name: Deploy artifact to preproduction
        run: |
          railway up --service nu-aura-backend-preprod \
                     --environment preproduction \
                     --project "$RAILWAY_PROJECT_ID" --detach
          echo "backend-image verified: ${{ needs.build.outputs.backend-image }}"

      - name: Wait for preproduction to become live
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -m 15 -o /dev/null -w '%{http_code}' \
                   "${PREPROD_BASE_URL}/actuator/health/liveness" || true)
            [ "$code" = "200" ] && { echo "preproduction live"; exit 0; }
            echo "waiting for preproduction (attempt ${i}, last ${code})..."
            sleep 15
          done
          echo "preproduction did not become live — failing the gate"
          exit 1

      # Config/security equivalence. A gate is only meaningful if the two
      # environments agree on the properties it exercises.
      - name: Configuration drift check
        run: |
          ./scripts/preprod/drift-check.sh \
            --project "$RAILWAY_PROJECT_ID" \
            --service nu-aura-backend \
            --preprod-service nu-aura-backend-preprod

      - name: Deployment verification (8 checks)
        env:
          VERIFY_EMAIL: ${{ secrets.PREPROD_VERIFY_EMAIL }}
          VERIFY_PASSWORD: ${{ secrets.PREPROD_VERIFY_PASSWORD }}
          VERIFY_SELF_EMPLOYEE_ID: ${{ secrets.PREPROD_SELF_EMPLOYEE_ID }}
          VERIFY_OTHER_EMPLOYEE_ID: ${{ secrets.PREPROD_OTHER_EMPLOYEE_ID }}
          VERIFY_OTHER_TENANT_EMPLOYEE_ID: ${{ secrets.PREPROD_OTHER_TENANT_EMPLOYEE_ID }}
          VERIFY_ADMIN_EMAIL: ${{ secrets.PREPROD_ADMIN_EMAIL }}
          VERIFY_ADMIN_PASSWORD: ${{ secrets.PREPROD_ADMIN_PASSWORD }}
        run: ./scripts/verify-deployment.sh --base-url "$PREPROD_BASE_URL"

  deploy-production:
    name: Deploy → production
    needs: [build, deploy-staging, verify-preproduction]
    # Prod NEVER auto-runs from push-to-main. Manual workflow_dispatch only,
    # AND the `production` environment below has required_reviewers configured
    # in GitHub repo settings as the second manual gate.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nu-aura.nulogic.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Auth GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: GKE auth
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: nu-aura-prod
          location: ${{ env.GCP_REGION }}

      # T1-03: smoke-test the cosign signature before we hand the image to
      # Kyverno at admission time. Same identity/issuer as
      # infra/deployment/kyverno/require-image-signature.yaml — keep in sync.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Verify image signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for IMAGE in "${{ needs.build.outputs.backend-image }}" "${{ needs.build.outputs.frontend-image }}"; do
            echo "Verifying signature for ${IMAGE}"
            cosign verify \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${IMAGE}"
          done

      - name: Prepare Helm prerequisites
        run: |
          set -euo pipefail
          kubectl create namespace hrms --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n hrms get secret hrms-secrets
          kubectl -n hrms get secret hrms-google-drive-credentials
          kubectl apply -f infra/deployment/kubernetes/configmap.yaml

      - name: Helm upgrade production
        run: |
          helm upgrade --install nu-aura infra/deployment/helm/hrms \
            --namespace hrms \
            --values infra/deployment/helm/hrms/values-prod.yaml \
            --set imageRegistry=${{ needs.build.outputs.image-registry }} \
            --set backend.image.repository=hrms-backend \
            --set backend.image.tag=${{ needs.build.outputs.image-tag }} \
            --set frontend.image.repository=hrms-frontend \
            --set frontend.image.tag=${{ needs.build.outputs.image-tag }}

      - name: Smoke test /actuator/health
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl -sf https://nu-aura.nulogic.com/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend /actuator/health = UP (attempt ${i})"
              exit 0
            fi
            echo "Health check pending (attempt ${i})..."
            sleep 15
          done
          echo "Smoke test FAILED — /actuator/health did not return UP within 5min"
          exit 1

  # Post-deploy verification of PRODUCTION itself. Unauthenticated checks always run.
  # Authenticated checks run only when legitimate production credentials are supplied
  # as secrets; otherwise the script reports SKIPPED with the reason. A preproduction
  # PASS is never treated as evidence about production.
  verify-production:
    name: Verify → production (post-deploy)
    needs: deploy-production
    if: ${{ always() && needs.deploy-production.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Deployment verification
        env:
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
          VERIFY_EMAIL: ${{ secrets.PROD_VERIFY_EMAIL }}
          VERIFY_PASSWORD: ${{ secrets.PROD_VERIFY_PASSWORD }}
          VERIFY_SELF_EMPLOYEE_ID: ${{ secrets.PROD_SELF_EMPLOYEE_ID }}
          VERIFY_OTHER_EMPLOYEE_ID: ${{ secrets.PROD_OTHER_EMPLOYEE_ID }}
        run: |
          if [ -z "${VERIFY_EMAIL}" ] || [ -z "${VERIFY_PASSWORD}" ]; then
            echo "No production verification credentials configured —"
            echo "authenticated checks will report SKIPPED-no-credentials."
            ./scripts/verify-deployment.sh --base-url "$PROD_BASE_URL" --skip-authenticated
          else
            ./scripts/verify-deployment.sh --base-url "$PROD_BASE_URL"
          fi
