# Cosign image signing — runs after the CI pipeline completes on `main`.
# Signs every published image with Sigstore (keyless OIDC via Rekor).
# Pairs with deployment/kyverno/require-image-signature.yaml which verifies
# the signature at admission time.
#
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# BLOCKER: .github/workflows/ci.yml currently sets `push: false` on both
# docker/build-push-action steps (backend + frontend). This workflow will
# NOT find any pushed images to sign until CI is updated to:
#   1. log in to the target registry (gcr.io or ghcr.io),
#   2. set `push: true` on the build-push-action steps,
#   3. produce a digest output we can consume here (use `id:` on the step
#      and reference `${{ steps.<id>.outputs.digest }}`).
# Until then this workflow is wired but inert. See FINAL OUTPUT notes.
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!

name: Cosign sign

on:
  workflow_run:
    workflows: [ "CI Pipeline" ]
    types: [ completed ]
    branches: [ main ]

# Sigstore keyless signing requires id-token: write to mint an OIDC token
# that Rekor / Fulcio will accept. packages: write is for ghcr.io pushes.
permissions:
  id-token: write
  packages: write
  contents: read

env:
  # Registry + image references — keep in sync with deployment/kyverno/require-image-signature.yaml.
  # These default to gcr.io; swap to ghcr.io/<org>/... if you migrate registries.
  BACKEND_IMAGE: gcr.io/PROJECT_ID/hrms-backend
  FRONTEND_IMAGE: gcr.io/PROJECT_ID/hrms-frontend
  # Image tag = the CI run's commit SHA. CI must publish under this same tag.
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  sign:
    name: Cosign sign images
    runs-on: ubuntu-latest
    # Only run if the upstream CI workflow succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Verify Cosign install
        run: cosign version

      # NOTE: registry auth — uncomment whichever block matches your registry.
      # Without these, `cosign sign` cannot read the image manifest to sign it.
      #
      # - name: Authenticate to GCR (Workload Identity)
      #   uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
      #     service_account: ${{ secrets.GCP_SA_EMAIL }}
      # - uses: google-github-actions/setup-gcloud@v2
      # - name: Configure gcloud auth helper
      #   run: gcloud auth configure-docker gcr.io --quiet
      #
      # - name: Authenticate to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign backend image (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          IMAGE="${BACKEND_IMAGE}:${IMAGE_TAG}"
          echo "Signing ${IMAGE}"
          cosign sign --yes "${IMAGE}"

      - name: Sign frontend image (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          IMAGE="${FRONTEND_IMAGE}:${IMAGE_TAG}"
          echo "Signing ${IMAGE}"
          cosign sign --yes "${IMAGE}"

      - name: Verify signatures (smoke check)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for IMAGE in "${BACKEND_IMAGE}:${IMAGE_TAG}" "${FRONTEND_IMAGE}:${IMAGE_TAG}"; do
            echo "Verifying ${IMAGE}"
            cosign verify \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/cosign-sign.yml@.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${IMAGE}"
          done

      - name: Summary
        run: |
          {
            echo "## Cosign sign summary"
            echo ""
            echo "- Backend: \`${BACKEND_IMAGE}:${IMAGE_TAG}\`"
            echo "- Frontend: \`${FRONTEND_IMAGE}:${IMAGE_TAG}\`"
            echo "- Signed via: keyless OIDC -> Sigstore Rekor"
            echo "- Verified by: deployment/kyverno/require-image-signature.yaml"
          } >> "$GITHUB_STEP_SUMMARY"
