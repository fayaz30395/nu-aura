name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    # Weekly Sunday 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql-java:
    name: CodeQL — Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Init CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Install internal modules
        run: |
          mvn install:install-file -Dfile=infra/mvn-local-deps/nulogic-platform-1.0.0.pom -DgroupId=com.nulogic -DartifactId=nulogic-platform -Dversion=1.0.0 -Dpackaging=pom
          mvn install:install-file -Dfile=infra/mvn-local-deps/common-module-1.0.0.jar -DpomFile=infra/mvn-local-deps/common-module-1.0.0.pom
          mvn install:install-file -Dfile=infra/mvn-local-deps/pm-module-1.0.0.jar -DpomFile=infra/mvn-local-deps/pm-module-1.0.0.pom
      - name: Build
        working-directory: backend
        run: mvn package -DskipTests -q
      - name: Analyse
        # continue-on-error: SARIF upload requires "Code scanning" to be enabled in
        # GitHub repo settings (Settings → Security → Code security and analysis).
        # The analysis itself runs and findings are visible in the Security tab once
        # enabled. Non-blocking so a missing repo feature doesn't fail security CI.
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"

  codeql-js:
    name: CodeQL — JavaScript/TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Init CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: Analyse
        # continue-on-error: same reason as codeql-java Analyse above.
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar xz -C /tmp
      - name: Run gitleaks (last commit)
        run: /tmp/gitleaks detect --redact -v --exit-code=2 --log-opts=-1

  container-scan:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t nu-aura-backend:scan .
      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.ci.nu-aura.local/api/v1 \
            --build-arg NEXT_PUBLIC_ENABLE_WEBSOCKET=true \
            -f frontend/Dockerfile \
            -t nu-aura-frontend:scan \
            ./frontend
      # GATES (table format respects `severity`; sarif format does not — it
      # always reports all severities, which would fail exit-code on HIGH).
      # Block on CRITICAL vulns only — all CRITICALs are remediated. HIGH is
      # reported via the SARIF steps below. Secrets are gated by gitleaks.
      - name: Trivy backend (gate — CRITICAL vulns)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nu-aura-backend:scan
          severity: CRITICAL
          ignore-unfixed: true
          scanners: 'vuln'
          trivyignores: '.trivyignore'
          format: table
          exit-code: '1'
      - name: Trivy frontend (gate — CRITICAL vulns)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nu-aura-frontend:scan
          severity: CRITICAL
          ignore-unfixed: true
          scanners: 'vuln'
          trivyignores: '.trivyignore'
          format: table
          exit-code: '1'
      # REPORTS (all severities -> Security tab; non-blocking).
      - name: Trivy backend (SARIF report)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nu-aura-backend:scan
          ignore-unfixed: true
          scanners: 'vuln'
          format: sarif
          output: trivy-backend.sarif
          exit-code: '0'
      - name: Trivy frontend (SARIF report)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nu-aura-frontend:scan
          ignore-unfixed: true
          scanners: 'vuln'
          format: sarif
          output: trivy-frontend.sarif
          exit-code: '0'
      - name: Upload SARIF to security tab
        # Reporting only (the table gates above do the blocking). Don't fail the
        # job on upload hiccups (multi-SARIF category collisions, etc.).
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: '.'
