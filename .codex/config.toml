[mcp_servers.ruflo]
args = [
    "-y",
    "ruflo@latest",
    "mcp",
    "start",
]
command = "npx"

[mcp_servers.ruflo.env]
CLAUDE_FLOW_HOOKS_ENABLED = "true"
CLAUDE_FLOW_MAX_AGENTS = "15"
CLAUDE_FLOW_MEMORY_BACKEND = "hybrid"
CLAUDE_FLOW_MODE = "v3"
CLAUDE_FLOW_TOPOLOGY = "hierarchical-mesh"
npm_config_update_notifier = "false"

[mcp_servers.ruflo.tools.memory_search]
approval_mode = "approve"

[mcp_servers.ruflo.tools.hooks_route]
approval_mode = "approve"

[mcp_servers.ruflo.tools.mcp_status]
approval_mode = "approve"

[mcp_servers.ruflo.tools.hooks_pre-task]
approval_mode = "approve"

[mcp_servers.ruflo.tools.hooks_model-route]
approval_mode = "approve"

[mcp_servers.ruflo.tools.hooks_intelligence_pattern-search]
approval_mode = "approve"

[mcp_servers.ruflo.tools.guidance_workflow]
approval_mode = "approve"

[mcp_servers.ruflo.tools.guidance_recommend]
approval_mode = "approve"

[mcp_servers.ruflo.tools.browser_open]
approval_mode = "approve"

[mcp_servers.ruflo.tools.hooks_coverage-route]
approval_mode = "approve"

[mcp_servers.ruflo.tools.swarm_init]
approval_mode = "approve"

[mcp_servers.ruflo.tools.agent_spawn]
approval_mode = "approve"

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS = "1"
CLAUDE_FLOW_HOOKS_ENABLED = "true"
CLAUDE_FLOW_V3_ENABLED = "true"
