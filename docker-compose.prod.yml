version: '3.9'

# NU-AURA HRMS — Production Docker Compose
# Usage: docker-compose -f docker-compose.prod.yml up -d
# Prerequisites: copy .env.production.example to .env and fill in all REQUIRED values

services:
  postgres:
    image: postgres:16-alpine
    container_name: hrms-postgres
    restart: always
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: ${FLYWAY_USER:?FLYWAY_USER must be a migration/owner role, not the runtime RLS user}
      POSTGRES_PASSWORD: ${FLYWAY_PASSWORD:?FLYWAY_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${FLYWAY_USER:?FLYWAY_USER must be set in .env} -d hrms" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hrms_network
    # Do NOT expose 5432 externally in production

  postgres-runtime-role:
    image: postgres:16-alpine
    container_name: hrms-postgres-runtime-role
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${FLYWAY_PASSWORD:?FLYWAY_PASSWORD must be set in .env}
      FLYWAY_USER: ${FLYWAY_USER:?FLYWAY_USER must be set in .env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME must be a non-BYPASSRLS runtime role}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set in .env}
    command:
      - sh
      - -ceu
      - |
        psql -h postgres -U "$${FLYWAY_USER}" -d hrms -v ON_ERROR_STOP=1 \
          -v runtime_role="$${SPRING_DATASOURCE_USERNAME}" \
          -v runtime_password="$${SPRING_DATASOURCE_PASSWORD}" <<'SQL'
        SELECT CASE
          WHEN EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'runtime_role')
            THEN format('ALTER ROLE %I LOGIN NOBYPASSRLS PASSWORD %L', :'runtime_role', :'runtime_password')
          ELSE format('CREATE ROLE %I LOGIN PASSWORD %L NOBYPASSRLS', :'runtime_role', :'runtime_password')
        END
        \gexec
        SELECT format('GRANT CONNECT ON DATABASE hrms TO %I', :'runtime_role')
        \gexec
        SELECT format('GRANT USAGE ON SCHEMA public TO %I', :'runtime_role')
        \gexec
        SELECT format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO %I', :'runtime_role')
        \gexec
        SELECT format('GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO %I', :'runtime_role')
        \gexec
        SELECT format('GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO %I', :'runtime_role')
        \gexec
        SELECT format('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I', :'runtime_role')
        \gexec
        SELECT format('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO %I', :'runtime_role')
        \gexec
        SELECT format('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO %I', :'runtime_role')
        \gexec
        SQL
    networks:
      - hrms_network

  redis:
    image: redis:7-alpine
    container_name: hrms-redis
    restart: always
    volumes:
      - redis_data:/data
    environment:
      SPRING_REDIS_PASSWORD: ${SPRING_REDIS_PASSWORD:?SPRING_REDIS_PASSWORD must be set in .env}
    command: >
      redis-server
      --appendonly yes
      --requirepass ${SPRING_REDIS_PASSWORD:?SPRING_REDIS_PASSWORD must be set in .env}
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${SPRING_REDIS_PASSWORD}\" ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hrms_network
    # Do NOT expose 6379 externally in production

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: hrms-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set in .env}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - hrms_network
    # Do NOT expose 9200 externally in production

  # MinIO removed — production uses Google Drive for file storage.
  # Google Drive credentials are mounted as a secret volume.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hrms-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres-runtime-role:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      RLS_PROBE_FAIL_ON_BYPASS: "true"
      APP_SCHEDULING_ENABLED: ${APP_SCHEDULING_ENABLED:-false}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hrms
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME must be a non-BYPASSRLS runtime role}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set in .env}
      FLYWAY_URL: jdbc:postgresql://postgres:5432/hrms
      FLYWAY_USER: ${FLYWAY_USER:?FLYWAY_USER must be set in .env}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?FLYWAY_PASSWORD must be set in .env}
      SPRING_FLYWAY_POSTGRESQL_TRANSACTIONAL_LOCK: "false"
      PROMETHEUS_SCRAPE_TOKEN: ${PROMETHEUS_SCRAPE_TOKEN:?PROMETHEUS_SCRAPE_TOKEN must be set in .env}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${SPRING_REDIS_PASSWORD:?SPRING_REDIS_PASSWORD must be set in .env}
      SPRING_REDIS_SSL_ENABLED: "false"
      # Google Drive storage configuration
      STORAGE_PROVIDER: google-drive
      GOOGLE_DRIVE_CREDENTIALS_PATH: /etc/secrets/google-drive/credentials.json
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:?GOOGLE_DRIVE_ROOT_FOLDER_ID must be set in .env}
    volumes:
      - ${GOOGLE_DRIVE_CREDENTIALS_FILE:?GOOGLE_DRIVE_CREDENTIALS_FILE must be set in .env}:/etc/secrets/google-drive/credentials.json:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hrms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set in .env}
        NEXT_PUBLIC_ENABLE_WEBSOCKET: ${NEXT_PUBLIC_ENABLE_WEBSOCKET:-true}
    container_name: hrms-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_DEMO_MODE: "false"
      NEXT_PUBLIC_ENABLE_WEBSOCKET: ${NEXT_PUBLIC_ENABLE_WEBSOCKET:-true}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - hrms_network

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:

networks:
  hrms_network:
    driver: bridge
