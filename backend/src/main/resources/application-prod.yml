spring:
  config:
    activate:
      on-profile: prod

  # Wave-10 P2-6: production gets a longer per-phase shutdown budget (45s vs
  # 30s default in application.yml). Real prod traffic carries longer-running
  # uploads/exports/STOMP sessions; the extra 15s avoids forcibly killing
  # in-flight work during a rolling deploy. Pod terminationGracePeriodSeconds
  # in the Helm chart is 60s, which exceeds this with headroom for the
  # Tomcat-stop and STOMP-broadcast phases combined.
  lifecycle:
    timeout-per-shutdown-phase: 45s

  datasource:
    hikari:
      # T4-16: Pod-level pool sized for Neon's pooled (PgBouncer transaction-mode)
      # endpoint. With the pooled endpoint, JDBC connections are leased-and-released
      # per transaction against PgBouncer (not Postgres) — each pod only needs
      # enough physical connections to cover in-flight queries, not steady-state
      # tenant load. 8/pod lets us scale to ~12 pods under Neon's 100-connection
      # ceiling while keeping headroom for Flyway (which uses the DIRECT endpoint,
      # see FLYWAY_URL — keep that unchanged).
      #
      # PRODUCTION ROLLOUT (see T4-16 in docs/architecture/improvement-backlog.md):
      #   1. In Neon console, copy the pooled endpoint host:
      #      ep-xxx-pooler.<region>.aws.neon.tech
      #   2. Update the K8s secret DB_HOST (or SPRING_DATASOURCE_URL) to point at
      #      the pooler host. Keep ?sslmode=require and append &pgbouncer=true.
      #   3. Leave FLYWAY_URL (or FLYWAY_HOST) pointed at the DIRECT endpoint —
      #      PgBouncer transaction-mode breaks Flyway's session-level advisory locks.
      maximum-pool-size: ${DB_POOL_MAX:8}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
      # T4-16: PgBouncer transaction-mode is incompatible with server-side
      # prepared statements (the prepared statement is bound to a server
      # connection that PgBouncer may hand to another client mid-transaction).
      # Disable the PG JDBC driver's server-side prepared-statement cache.
      # Set auto-commit explicitly so no code path relies on connection-level
      # state surviving across transactions (PgBouncer wouldn't preserve it).
      auto-commit: true
      data-source-properties:
        prepareThreshold: 0
        preparedStatementCacheQueries: 0
        preparedStatementCacheSizeMiB: 0

    # Optional read-replica routing (wave-3 H7 / C7).
    # RoutingDataSourceConfig activates ONLY when SPRING_DATASOURCE_REPLICA_URL is set.
    # When configured, @Transactional(readOnly=true) methods route to the Neon read
    # replica endpoint; writes and default-tx paths stay on the primary above.
    # Provision the replica endpoint in Neon and inject these via K8s secrets:
    #
    #   SPRING_DATASOURCE_REPLICA_URL=jdbc:postgresql://replica.<project>.neon.tech:5432/hrms?sslmode=require
    #   SPRING_DATASOURCE_REPLICA_USERNAME=<replica-role>
    #   SPRING_DATASOURCE_REPLICA_PASSWORD=<replica-secret>
    #
    # The replica Hikari pool is marked read-only at the JDBC layer (writes fail fast),
    # and TenantAwareDataSourceConfig still injects app.current_tenant_id so RLS
    # enforcement holds on the replica too. Connection pool sized identically to primary
    # (20 max / 5 min) — adjust via env vars if replica traffic profile differs.
    replica:
      url: ${SPRING_DATASOURCE_REPLICA_URL:}
      username: ${SPRING_DATASOURCE_REPLICA_USERNAME:}
      password: ${SPRING_DATASOURCE_REPLICA_PASSWORD:}
      driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # CRITICAL: Never auto-modify schema in production
      # Use Flyway for all schema changes
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # Disable statistics in production for performance
        generate_statistics: false

  flyway:
    enabled: true
    # CRITICAL: Prevent accidental schema destruction in production
    clean-disabled: true
    # Validate migrations on startup
    validate-on-migrate: true

  # Redis is required in production for distributed caching and idempotency
  # SPRING_REDIS_HOST defaults to localhost so the app can start without Redis configured;
  # all Redis components have in-memory fallbacks (TokenBlacklist → ConcurrentHashMap,
  # rate limiter → Bucket4j). Configure a real Redis host (e.g. Upstash) via env var.
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      ssl:
        # Default flipped to true (compliance #11, wave-3 deployment audit).
        # Production Redis (Upstash, GCP Memorystore TLS, AWS ElastiCache TLS) is
        # always TLS-protected; defaulting to plain made it trivial for an operator
        # to forget the env var and silently send credentials in cleartext.
        # Local dev / docker-compose can still override via SPRING_REDIS_SSL_ENABLED=false.
        enabled: ${SPRING_REDIS_SSL_ENABLED:true}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

# Production health probes configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      # Production: never expose health details (override default when-authorized)
      show-details: never
      probes:
        enabled: true
      # Validate group membership to control access
      validate-group-membership: true
      group:
        # Kubernetes liveness probe — ping only. diskSpace MUST NOT be here:
        # a full disk would trigger pod restart (CrashLoop) instead of just
        # marking the pod as un-ready. Disk-full is handled by readiness below.
        liveness:
          include: ping
        # Readiness probe — kafka excluded because Render doesn't run Kafka.
        # Redis is included: if Redis is down, app should not receive traffic
        # (rate-limiter / token-blacklist fallbacks are per-pod only and not safe
        # for sustained multi-pod traffic). K8s deployments can override via env.
        readiness:
          include: ping,db,redis
    prometheus:
      enabled: true
  health:
    db:
      enabled: true
    redis:
      # Redis health reported as info only — code has in-memory fallbacks.
      # Set SPRING_REDIS_HOST env var to a real Redis instance for full caching.
      enabled: true
    # Kafka health disabled on Render (no Kafka broker).
    # Re-enable per-environment by setting MANAGEMENT_HEALTH_KAFKA_ENABLED=true
    # (e.g. on GKE with Confluent Kafka).
    kafka:
      enabled: ${MANAGEMENT_HEALTH_KAFKA_ENABLED:false}
    diskSpace:
      enabled: true
      threshold: 1GB
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      region: ${METRICS_REGION:default}
      environment: production

# Production error handling
server:
  forward-headers-strategy: framework
  error:
    # CRITICAL: Never expose stack traces in production
    include-stacktrace: never
    include-message: never
    include-binding-errors: false
    include-exception: false

# Disable API docs / Swagger UI in production
springdoc:
  show-actuator: false
  swagger-ui:
    enabled: false

# Production security settings
app:
  cookie:
    # CRITICAL: Always use secure cookies (HTTPS only) in production
    secure: true
    # S10-J: prod is the canonical home for the __Host- prefix — it's the only
    # profile that runs over HTTPS, and the prefix is silently dropped without
    # Secure. Set COOKIE_USE_HOST_PREFIX=true at the canary stage once all
    # cookie readers (AuthController @CookieValue, TenantFilter, etc.) have
    # been migrated to accept both legacy and hardened names.
    use-host-prefix: ${COOKIE_USE_HOST_PREFIX:false}
  security:
    csrf:
      # Enable CSRF protection in production
      enabled: true
    # ClamAV virus scanning ON in production. Host/port must point at the clamd
    # sidecar/service; defaults assume a co-located daemon. Timeout chosen to be
    # well below the upload controller request timeout so a slow clamd surfaces
    # as a per-request warning rather than a request-thread stall.
    virusscan:
      enabled: ${VIRUSSCAN_ENABLED:true}
      host: ${VIRUSSCAN_HOST:clamav}
      port: ${VIRUSSCAN_PORT:3310}
      timeout-ms: ${VIRUSSCAN_TIMEOUT_MS:10000}

  # Google Drive file storage (production service account)
  google-drive:
    credentials-path: ${GOOGLE_DRIVE_CREDENTIALS_PATH:/etc/secrets/google-drive/credentials.json}
    root-folder-id: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:}
    application-name: ${GOOGLE_DRIVE_APP_NAME:NU-AURA-HRMS}

  # CORS — must be explicitly set via env var in production; no wildcard permitted
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.nulogic.io}

  # Rate limiting ON in production to prevent abuse
  rate-limit:
    enabled: true
    requests-per-minute: 60
    auth:
      capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
      refill-tokens: ${RATE_LIMIT_AUTH_REFILL:10}
      refill-minutes: ${RATE_LIMIT_AUTH_REFILL_MIN:1}
    api:
      capacity: ${RATE_LIMIT_API_CAPACITY:100}
      refill-tokens: ${RATE_LIMIT_API_REFILL:100}
      refill-minutes: ${RATE_LIMIT_API_REFILL_MIN:1}
    export:
      capacity: ${RATE_LIMIT_EXPORT_CAPACITY:5}
      refill-tokens: ${RATE_LIMIT_EXPORT_REFILL:5}
      refill-minutes: ${RATE_LIMIT_EXPORT_REFILL_MIN:5}
    wall:
      capacity: ${RATE_LIMIT_WALL_CAPACITY:30}
      refill-tokens: ${RATE_LIMIT_WALL_REFILL:30}
      refill-minutes: ${RATE_LIMIT_WALL_REFILL_MIN:1}

logging:
  level:
    root: INFO
    com.nulogic: INFO
    org.springframework.security: INFO
    # Silence SQL and parameter-binding logs in production to prevent PII leakage
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.hibernate.orm.jdbc.bind: WARN
