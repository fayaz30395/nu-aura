# Render.com cloud deployment profile
# Activated via SPRING_PROFILES_ACTIVE=render on Render.com free plan
spring:
  config:
    activate:
      on-profile: render

  main:
    lazy-initialization: true

  autoconfigure:
    # Use spring.autoconfigure.exclude (not spring.main.exclude) — the canonical way
    # to exclude autoconfiguration classes. spring.main.exclude is unreliable for
    # autoconfiguration classes in profile-specific YAMLs.
    #
    # Redis + Elasticsearch: not provisioned on Railway; exclusion reduces startup
    # time from 90+ seconds to under 30. Direct bean usage is preserved.
    #
    # Kafka: not provisioned on Railway; transactional outbox handles event dispatch.
    # Excluding KafkaAutoConfiguration ensures KafkaListenerAnnotationBeanPostProcessor
    # is never registered, so @KafkaListener annotations on consumer beans are ignored.
    # KafkaConfig itself is also @ConditionalOnProperty(app.kafka.enabled=true) for safety.
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      # idle-timeout: applies only to connections above minimum-idle (i.e. connections 2-3).
      # Set to 2 min so surplus connections are released quickly in low-traffic periods.
      idle-timeout: 120000
      # max-lifetime must be < Neon's idle-connection timeout (5 min / 300 s).
      # 270 s gives HikariCP time to recycle the connection before Neon kills it.
      max-lifetime: 270000
      # keepalive-time: HikariCP sends a lightweight keepalive query (SELECT 1) to
      # idle connections every 2 min. Without this, the minimum-idle connection is
      # exempt from idle-timeout eviction and will become stale when Neon closes it
      # after 5 min of server-side inactivity.
      keepalive-time: 120000
      # initialization-fail-timeout=0: HikariCP creates the pool without blocking on
      # an initial connection. The default (1ms) calls checkFailFast() which tries to
      # open a JDBC connection at pool creation time — blocking for 5-7 min while Neon
      # wakes from its serverless sleep. With 0, the pool starts empty and the first
      # real query establishes connections lazily (after Tomcat has already bound).
      initialization-fail-timeout: 0

  jpa:
    hibernate:
      # none: skip schema validation (Flyway is disabled, schema is pre-migrated)
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        # Explicitly set dialect so Hibernate doesn't need a DB connection at startup
        # to auto-detect it. Without this, Hibernate 6.x throws
        # "Unable to determine Dialect without JDBC metadata" if the Neon DB
        # connection is slow or times out during bean initialization.
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Prevent JdbcEnvironmentInitiator from opening a JDBC connection during
        # LocalContainerEntityManagerFactoryBean.afterPropertiesSet() to read DB
        # metadata (sequences, type defaults, etc.). With dialect explicitly set
        # above, Hibernate can determine all defaults without a live connection.
        # Note: temp.use_jdbc_metadata_defaults is deprecated in Hibernate 6;
        # the canonical name is hibernate.boot.allow_jdbc_metadata_access=false.
        boot:
          allow_jdbc_metadata_access: false

  data:
    jpa:
      repositories:
        # LAZY bootstrap: JPA repositories are initialized only on first use,
        # not during context refresh. Prevents LocalContainerEntityManagerFactoryBean
        # from triggering at startup, which blocked the app for 3+ min while
        # Neon (serverless DB) woke from sleep.
        bootstrap-mode: lazy
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000
      repositories:
        # CRITICAL: disable Redis repository scanning — Spring scans all 274 JPA
        # repos as potential Redis repos, adding 60+ sec to startup and flooding logs.
        # Direct Redis usage (TokenBlacklist, rate-limiter) is unaffected.
        enabled: false

  # Elasticsearch — not provisioned on Render free plan; set short timeouts so
  # FluenceDocumentRepository doesn't block startup for 30+ seconds
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 2s
    # Disable auto-index creation to avoid startup connection requirement
    repositories:
      enabled: false

  # Use simple in-memory cache — no Redis needed on Render free plan
  cache:
    type: simple

  flyway:
    # Enable Flyway so new migrations (e.g. V300 outbox table) are applied on deploy.
    # Railway uses always-on PostgreSQL so migration time is not a concern.
    # Override to false via FLYWAY_ENABLED=false env var if needed.
    enabled: ${FLYWAY_ENABLED:true}


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      validate-group-membership: false
      group:
        liveness:
          include: ping,diskSpace
        readiness:
          include: ping,db
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
    elasticsearch:
      enabled: false
    diskSpace:
      # Render/Railway containers have limited disk; use a minimal threshold so
      # the liveness probe doesn't report DOWN due to available disk size.
      threshold: 10MB

server:
  # Render injects PORT env var (default 10000); Spring Boot must bind to that port
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 8
      min-spare: 1
    accept-count: 8
    max-connections: 16
    connection-timeout: 5s
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

app:
  payments:
    # Enable payments module by default in Render profile.
    # Override to false only when payments must be intentionally disabled.
    enabled: ${APP_PAYMENTS_ENABLED:true}

  scheduling:
    # Render free-tier first release prioritizes interactive app stability.
    # Background schedulers are disabled until a paid worker/cron surface exists.
    enabled: ${APP_SCHEDULING_ENABLED:false}

  outbox:
    # Outbox processor runs independently of app.scheduling.enabled via its own
    # @EnableScheduling config. Processes events every 5 seconds.
    enabled: true
    poll-interval-ms: 5000

  kafka:
    # Kafka not provisioned on Railway — disable KafkaConfig and DeadLetterHandler beans.
    # Consumer @Service beans still exist; OutboxEventProcessor calls process() directly.
    enabled: false

  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600000
    refresh-expiration: 86400000

  cookie:
    secure: true

  security:
    csrf:
      enabled: true
    rls:
      probe:
        fail-on-bypass: true
        allow-bootstrap-skip: false
    # AES-256 key for EncryptionService (used by SAML IdP config).
    # SAML is not active on Render — this default keeps the bean from failing.
    # Override via APP_SECURITY_ENCRYPTION_KEY env var if SAML is ever enabled.
    encryption:
      key: ${APP_SECURITY_ENCRYPTION_KEY:?APP_SECURITY_ENCRYPTION_KEY must be set}

  rls:
    datasource-wrapper:
      enabled: ${RLS_DATASOURCE_WRAPPER_ENABLED:false}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://hrms-frontend-vert.vercel.app}

  auth:
    # First-release Render runs the seeded NuLogic tenant only. Runtime RLS
    # prevents tenant auto-detection from a tenantless email lookup, so default
    # password login to the NuLogic tenant unless explicitly overridden.
    default-tenant-id: ${APP_AUTH_DEFAULT_TENANT_ID:660e8400-e29b-41d4-a716-446655440001}

  google-drive:
    credentials-path: ${GOOGLE_DRIVE_CREDENTIALS_PATH:/etc/secrets/google-drive/credentials.json}
    root-folder-id: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:}
    application-name: NU-AURA-HRMS

  monitoring:
    # Set PROMETHEUS_SCRAPE_TOKEN in Railway/Render env vars to allow an external
    # Prometheus instance to scrape /actuator/prometheus with Bearer token auth.
    # Leave empty to permit SUPER_ADMIN-only access.
    prometheus-token: ${PROMETHEUS_SCRAPE_TOKEN:}

  rate-limit:
    enabled: true
    # Render/Railway: set RATE_LIMIT_USE_REDIS=true when managed Redis is provisioned.
    use-redis: ${RATE_LIMIT_USE_REDIS:false}
    requests-per-minute: 60

  account-lockout:
    # Render first release runs one instance without Redis. Keep brute-force
    # lockout active with the local fallback instead of failing password login.
    use-redis: ${ACCOUNT_LOCKOUT_USE_REDIS:false}

  frontend:
    url: ${FRONTEND_URL:https://hrms-frontend-vert.vercel.app}

logging:
  level:
    root: INFO
    com.nulogic: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
    org.springframework.boot.autoconfigure: WARN
