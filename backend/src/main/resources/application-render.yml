# Render.com cloud deployment profile
# Activated via SPRING_PROFILES_ACTIVE=render on Render.com free plan
spring:
  config:
    activate:
      on-profile: render

  main:
    lazy-initialization: true
    # Exclude Redis and Elasticsearch auto-configuration on Render — reduces startup
    # time from 90+ seconds to under 30. Direct Redis bean usage is preserved.
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      # Do not fail-fast if Kafka is unavailable — allows app to start without Kafka
      fail-fast: false
    producer:
      bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: false

  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
      # initialization-fail-timeout=0: HikariCP creates the pool without blocking on
      # an initial connection. The default (1ms) calls checkFailFast() which tries to
      # open a JDBC connection at pool creation time — blocking for 5-7 min while Neon
      # wakes from its serverless sleep. With 0, the pool starts empty and the first
      # real query establishes connections lazily (after Tomcat has already bound).
      initialization-fail-timeout: 0

  jpa:
    hibernate:
      # none: skip schema validation (Flyway is disabled, schema is pre-migrated)
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        # Explicitly set dialect so Hibernate doesn't need a DB connection at startup
        # to auto-detect it. Without this, Hibernate 6.x throws
        # "Unable to determine Dialect without JDBC metadata" if the Neon DB
        # connection is slow or times out during bean initialization.
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Prevent JdbcEnvironmentInitiator from opening a JDBC connection during
        # LocalContainerEntityManagerFactoryBean.afterPropertiesSet() to read DB
        # metadata (sequences, type defaults, etc.). With dialect explicitly set
        # above, Hibernate can determine all defaults without a live connection.
        # Note: temp.use_jdbc_metadata_defaults is deprecated in Hibernate 6;
        # the canonical name is hibernate.boot.allow_jdbc_metadata_access=false.
        boot:
          allow_jdbc_metadata_access: false

  data:
    jpa:
      repositories:
        # LAZY bootstrap: JPA repositories are initialized only on first use,
        # not during context refresh. Prevents LocalContainerEntityManagerFactoryBean
        # from triggering at startup, which blocked the app for 3+ min while
        # Neon (serverless DB) woke from sleep.
        bootstrap-mode: lazy
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000
      repositories:
        # CRITICAL: disable Redis repository scanning — Spring scans all 274 JPA
        # repos as potential Redis repos, adding 60+ sec to startup and flooding logs.
        # Direct Redis usage (TokenBlacklist, rate-limiter) is unaffected.
        enabled: false

  # Elasticsearch — not provisioned on Render free plan; set short timeouts so
  # FluenceDocumentRepository doesn't block startup for 30+ seconds
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 2s
    # Disable auto-index creation to avoid startup connection requirement
    repositories:
      enabled: false

  # Use simple in-memory cache — no Redis needed on Render free plan
  cache:
    type: simple

  flyway:
    # DB is already migrated — disable Flyway on startup to avoid
    # running 100+ migrations and exceeding health check timeout
    enabled: false


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      validate-group-membership: false
      group:
        liveness:
          include: ping,diskSpace
        readiness:
          include: ping,db
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
    elasticsearch:
      enabled: false
    diskSpace:
      # Render free-tier containers have ~1GB total disk; 1GB threshold always fails.
      # Use a minimal threshold so the liveness probe doesn't report DOWN on Render.
      threshold: 10MB

server:
  # Render injects PORT env var (default 10000); Spring Boot must bind to that port
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 24
      min-spare: 2
    accept-count: 16
    max-connections: 64
    connection-timeout: 5s
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

app:
  kafka:
    admin:
      # Kafka is not provisioned for the Render first-release deployment. Keep
      # producer/listener beans available, but skip startup topic creation calls.
      auto-create: false

  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600000
    refresh-expiration: 86400000

  cookie:
    secure: true

  security:
    csrf:
      enabled: true
    # AES-256 key for EncryptionService (used by SAML IdP config).
    # SAML is not active on Render — this default keeps the bean from failing.
    # Override via APP_SECURITY_ENCRYPTION_KEY env var if SAML is ever enabled.
    encryption:
      key: ${APP_SECURITY_ENCRYPTION_KEY:?APP_SECURITY_ENCRYPTION_KEY must be set}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://hrms-frontend-vert.vercel.app}

  auth:
    # First-release Render runs the seeded NuLogic tenant only. Runtime RLS
    # prevents tenant auto-detection from a tenantless email lookup, so default
    # password login to the NuLogic tenant unless explicitly overridden.
    default-tenant-id: ${APP_AUTH_DEFAULT_TENANT_ID:660e8400-e29b-41d4-a716-446655440001}

  google-drive:
    credentials-path: ${GOOGLE_DRIVE_CREDENTIALS_PATH:/etc/secrets/google-drive/credentials.json}
    root-folder-id: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:}
    application-name: NU-AURA-HRMS

  rate-limit:
    enabled: true
    # Render first release runs a single instance without Redis. Use the local
    # Bucket4j limiter by default so auth stays available; set
    # RATE_LIMIT_USE_REDIS=true after provisioning managed Redis/Key Value.
    use-redis: ${RATE_LIMIT_USE_REDIS:false}
    requests-per-minute: 60

  account-lockout:
    # Render first release runs one instance without Redis. Keep brute-force
    # lockout active with the local fallback instead of failing password login.
    use-redis: ${ACCOUNT_LOCKOUT_USE_REDIS:false}

  frontend:
    url: ${FRONTEND_URL:https://hrms-frontend-vert.vercel.app}

logging:
  level:
    root: INFO
    com.nulogic: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
    org.springframework.boot.autoconfigure: WARN
