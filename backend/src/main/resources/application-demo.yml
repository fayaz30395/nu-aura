# Demo profile: includes seed data migration location
# Activate with: SPRING_PROFILES_ACTIVE=demo
# Loads V8__demo_seed_data.sql with Acme Corp sample data (users, employees, projects, leave types)
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    placeholders:
      # H-1: the live demo keeps the seeded "Welcome@123" logins. The base
      # application.yml default is fail-closed (false); demo opts in explicitly.
      demoCredentialsEnabled: ${DEMO_CREDENTIALS_ENABLED:true}
