spring:
  main:
    allow-bean-definition-overriding: true

  # Datasource URL / username / password are injected at runtime by
  # AbstractPostgresIntegrationTest via @DynamicPropertySource. Tests that
  # load a Spring context MUST extend AbstractPostgresIntegrationTest so the
  # singleton Postgres container is wired before the ApplicationContext starts.
  datasource:
    driver-class-name: org.postgresql.Driver
    # Replica URL pinned empty — keeps RoutingDataSourceConfig dormant under
    # the test profile. Without this, a stray SPRING_DATASOURCE_REPLICA_URL in
    # the environment could accidentally activate read-replica routing.
    replica:
      url: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    clean-disabled: false

  liquibase:
    enabled: false

  # Redis disabled — tests use the simple in-memory cache below.
  data:
    redis:
      repositories:
        enabled: false

  cache:
    type: simple

  kafka:
    bootstrap-servers: localhost:9092
    admin:
      fail-fast: false
    consumer:
      auto-offset-reset: earliest
    properties:
      request.timeout.ms: 5000
      retry.backoff.ms: 500

  mail:
    host: localhost
    port: 25

management:
  health:
    redis:
      enabled: false
    mail:
      enabled: false
    db:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: false

app:
  kafka:
    enabled: false   # prevents KafkaAdmin timeout + satisfies KafkaOutboxMutualExclusionGuard
  scheduling:
    enabled: false

  # RLS disabled in tests — existing tests don't set tenant context.
  # Flip these on once tests set X-Tenant-ID / SET LOCAL app.current_tenant_id.
  rls:
    transaction-manager:
      enabled: false
    datasource-wrapper:
      enabled: false
  security:
    encryption:
      key: test-encryption-key-32-bytes-xx!
  jwt:
    secret: b8f3d0c9a1e2f4b7c6d8e9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8
    expiration: 3600000
    refresh-expiration: 86400000

  tenant:
    resolution-strategy: header
    header-name: X-Tenant-ID

  frontend:
    url: http://localhost:3000

  features:
    lwf: true

  google-drive:
    credentials-path: ${GOOGLE_DRIVE_CREDENTIALS_PATH:config/test-credentials.json}
    root-folder-id: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:test-root-folder}
    application-name: NU-AURA-HRMS-TEST

  storage:
    url-expiry-hours: 1

ai:
  openai:
    api-key: test-key
    base-url: http://localhost:8081

logging:
  level:
    root: WARN
    com.nulogic: INFO
    org.springframework.test: WARN
    org.hibernate: WARN
    org.springframework.boot.autoconfigure: ERROR
    org.testcontainers: WARN
    com.github.dockerjava: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
