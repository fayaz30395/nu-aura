global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'hrms-platform'

# AlertManager wiring — T2-07
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Alert rule files (mounted via docker-compose at /etc/prometheus/rules)
rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]

  # HRMS Backend metrics
  - job_name: 'hrms-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'backend:8080' ]
    scrape_interval: 10s
    scrape_timeout: 5s
