# T2-07 minimal AlertManager routing for NU-AURA.
# TODO: replace <SLACK_WEBHOOK_PLACEHOLDER> with the real Slack incoming-webhook URL
# (sourced from secret manager; do NOT commit the real value).
global:
  resolve_timeout: 5m

route:
  receiver: slack-default
  group_by: [ 'alertname', 'severity' ]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: slack-default
    slack_configs:
      # TODO: swap placeholder for real webhook (e.g. via env templating or secret mount)
      - api_url: '<SLACK_WEBHOOK_PLACEHOLDER>'
        channel: '#nu-aura-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |
          *Severity:* {{ .CommonLabels.severity }}
          *Component:* {{ .CommonLabels.component }}
          {{ range .Alerts }}• {{ .Annotations.summary }}
          {{ .Annotations.description }}{{ end }}
