# T2-07 minimal AlertManager routing for NU-AURA.
# SLACK_WEBHOOK_URL is expanded by Alertmanager at startup via --config.expand-env.
# Do not commit the real webhook URL.
global:
  resolve_timeout: 5m

route:
  receiver: slack-default
  group_by: [ 'alertname', 'severity' ]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: slack-default
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#nu-aura-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |
          *Severity:* {{ .CommonLabels.severity }}
          *Component:* {{ .CommonLabels.component }}
          {{ range .Alerts }}• {{ .Annotations.summary }}
          {{ .Annotations.description }}{{ end }}
