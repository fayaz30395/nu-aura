{{- if .Values.serviceAccount.enabled }}
# ServiceAccount + RoleBinding — least-privilege identities for backend / frontend.
# Gated by .Values.serviceAccount.enabled (off in default values.yaml,
# on in values-prod.yaml / values-staging.yaml).
#
# Workload identity (GKE):
#   The iam.gke.io/gcp-service-account annotation binds the KSA to a GSA.
#   The GSA must exist in IAM and have roles/iam.workloadIdentityUser granted
#   to the KSA member (serviceAccount:PROJECT_ID.svc.id.goog[NS/KSA_NAME]).
#   This chart only provisions the KSA — IAM bindings are handled by Terraform.
#
# RBAC scope: deliberately minimal — backend reads its own ConfigMaps/Secrets
# (via Spring Cloud Kubernetes config), nothing else. Frontend gets NO API
# access (read-only KSA only used for workload identity / pod identity).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.backend.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: hrms
    component: backend
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
  {{- with .Values.serviceAccount.backend.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.frontend.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: hrms
    component: frontend
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
  {{- with .Values.serviceAccount.frontend.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Frontend does not need a service account token — Next.js doesn't call
# the K8s API. Reduces attack surface (token can't be stolen from the pod).
automountServiceAccountToken: false
---
# Role: read own ConfigMap + Secret refs (Spring Cloud Kubernetes Config).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hrms-backend-config-reader
  namespace: {{ .Values.namespace }}
  labels:
    app: hrms
    component: backend
rules:
  - apiGroups: [ "" ]
    resources: [ "configmaps" ]
    resourceNames: [ "hrms-config" ]
    verbs: [ "get", "watch", "list" ]
  - apiGroups: [ "" ]
    resources: [ "secrets" ]
    resourceNames: [ "hrms-secrets" ]
    verbs: [ "get", "watch", "list" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hrms-backend-config-reader
  namespace: {{ .Values.namespace }}
  labels:
    app: hrms
    component: backend
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.backend.name }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: hrms-backend-config-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
