# =============================================================================
# NU-AURA HRMS — Staging Overrides
# =============================================================================
# Layer this on top of values.yaml:
#   helm install hrms ./deployment/helm/hrms -f values-staging.yaml
#
# Staging posture:
#   - 2 backend replicas / 1 frontend replica (smoke + smaller traffic)
#   - Reduced resources vs prod (cost-tuned for non-prod GKE pool)
#   - HPA + NetworkPolicy ON for parity with prod
#   - Probe tuning identical to prod so we catch probe regressions here first
# =============================================================================

# -----------------------------------------------------------------------------
# Backend (Spring Boot)
# -----------------------------------------------------------------------------
backend:
  replicas: 2

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  javaOpts: "-Xms512m -Xmx768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError"

  probes:
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 30
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    startup:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 30

  pdb:
    enabled: true
    minAvailable: 1

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: hrms
          component: backend

# -----------------------------------------------------------------------------
# Frontend (Next.js)
# -----------------------------------------------------------------------------
frontend:
  replicas: 1

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

  probes:
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 30
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    startup:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 30

  pdb:
    enabled: false

# -----------------------------------------------------------------------------
# HPA — on in staging (mirror prod behavior, narrower range)
# -----------------------------------------------------------------------------
hpa:
  enabled: true
  backend:
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  frontend:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

# -----------------------------------------------------------------------------
# NetworkPolicy — on in staging (catch policy regressions before prod)
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: true
  ingressNamespaceLabel: "ingress-nginx"

# -----------------------------------------------------------------------------
# ServiceAccount — workload identity for staging
# -----------------------------------------------------------------------------
serviceAccount:
  enabled: true
  backend:
    name: hrms-backend-sa
    annotations:
      iam.gke.io/gcp-service-account: "hrms-backend-staging@PROJECT_ID.iam.gserviceaccount.com"
  frontend:
    name: hrms-frontend-sa
    annotations:
      iam.gke.io/gcp-service-account: "hrms-frontend-staging@PROJECT_ID.iam.gserviceaccount.com"

# -----------------------------------------------------------------------------
# Ingress — staging hosts
# -----------------------------------------------------------------------------
ingress:
  hosts:
    frontend: hrms-staging.nulogic.com
    api: api.hrms-staging.nulogic.com
