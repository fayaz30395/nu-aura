apiVersion: v1
kind: Secret
metadata:
  name: hrms-secrets
  namespace: hrms
  labels:
    app: hrms
type: Opaque
# SECURITY: Do NOT store real secrets in this template file.
# Use one of these approaches to populate secrets:
#   1. kubectl create secret generic hrms-secrets --from-env-file=.env.secrets -n hrms
#   2. External secrets manager (GCP Secret Manager, Vault, etc.)
#   3. Sealed Secrets or SOPS for GitOps workflows
# The base64 values below are all "CHANGEME" — decode with: echo Q0hBTkdFTUU= | base64 -d
data:
  # ─── Database ──────────────────────────────────────────────────────────────────
  # REQUIRED: must use jdbc:postgresql:// prefix (NOT postgresql://)
  SPRING_DATASOURCE_URL: "Q0hBTkdFTUU="
  SPRING_DATASOURCE_USERNAME: "Q0hBTkdFTUU="
  SPRING_DATASOURCE_PASSWORD: "Q0hBTkdFTUU="

  # ─── JWT (Authentication) ──────────────────────────────────────────────────────
  # REQUIRED: generate with: openssl rand -hex 32
  JWT_SECRET: "Q0hBTkdFTUU="
  JWT_EXPIRATION: "MzYwMDAwMA=="
  JWT_REFRESH_EXPIRATION: "ODY0MDAwMDA="

  # ─── Encryption (AES-256-GCM for sensitive DB fields) ─────────────────────────
  # REQUIRED: exactly 32 bytes. Generate with: openssl rand -base64 32
  APP_SECURITY_ENCRYPTION_KEY: "Q0hBTkdFTUU="

  # ─── Redis ─────────────────────────────────────────────────────────────────────
  SPRING_REDIS_HOST: "Q0hBTkdFTUU="
  SPRING_REDIS_PORT: "NjM3OQ=="
  SPRING_REDIS_PASSWORD: "Q0hBTkdFTUU="
  SPRING_REDIS_SSL_ENABLED: "ZmFsc2U="

  # ─── Google Drive (File Storage) ───────────────────────────────────────────────
  # REQUIRED: Root folder ID in Google Drive where all tenant files are stored
  GOOGLE_DRIVE_ROOT_FOLDER_ID: "Q0hBTkdFTUU="
  # NOTE: Google Drive service account credentials JSON must be stored in a
  # separate secret named 'hrms-google-drive-credentials' with key 'credentials.json'.
  # Create it with: kubectl create secret generic hrms-google-drive-credentials \
  #   --from-file=credentials.json=path/to/service-account-key.json -n hrms

  # ─── Email (SMTP) ──────────────────────────────────────────────────────────────
  MAIL_HOST: "Q0hBTkdFTUU="
  MAIL_PORT: "NTg3"
  MAIL_USERNAME: "Q0hBTkdFTUU="
  MAIL_PASSWORD: "Q0hBTkdFTUU="
  MAIL_FROM: "Q0hBTkdFTUU="

  # ─── Google OAuth ──────────────────────────────────────────────────────────────
  GOOGLE_CLIENT_ID: "Q0hBTkdFTUU="
  GOOGLE_CLIENT_SECRET: "Q0hBTkdFTUU="

  # ─── Frontend ──────────────────────────────────────────────────────────────────
  FRONTEND_URL: "Q0hBTkdFTUU="
  COOKIE_DOMAIN: "Q0hBTkdFTUU="

  # ─── Auth Domain Restriction ───────────────────────────────────────────────────
  AUTH_ALLOWED_DOMAIN: "Q0hBTkdFTUU="

  # ─── Twilio SMS (optional — set TWILIO_MOCK_MODE=false to enable) ──────────────
  TWILIO_MOCK_MODE: "dHJ1ZQ=="
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_FROM_NUMBER: ""
  TWILIO_MESSAGING_SERVICE_SID: ""

  # ─── Calendar Integration (optional — set CALENDAR_MOCK_MODE=false to enable) ──
  CALENDAR_MOCK_MODE: "dHJ1ZQ=="
  GOOGLE_CALENDAR_CLIENT_ID: ""
  GOOGLE_CALENDAR_CLIENT_SECRET: ""
  GOOGLE_CALENDAR_REDIRECT_URI: ""
  OUTLOOK_CALENDAR_CLIENT_ID: ""
  OUTLOOK_CALENDAR_CLIENT_SECRET: ""
  OUTLOOK_TENANT_ID: ""

  # ─── Elasticsearch ────────────────────────────────────────────────────────────
  # REQUIRED: password for Elasticsearch xpack security
  ELASTIC_PASSWORD: "Q0hBTkdFTUU="

  # ─── OpenAI / AI (optional — ATS resume parsing) ──────────────────────────────
  OPENAI_API_KEY: ""
  OPENAI_MODEL: "Z3B0LTRvLW1pbmk="

  # ─── Slack Notifications (optional) ───────────────────────────────────────────
  SLACK_ENABLED: "ZmFsc2U="
  SLACK_WEBHOOK_URL: ""
  SLACK_BOT_TOKEN: ""
  SLACK_DEFAULT_CHANNEL: "I2hybXMtbm90aWZpY2F0aW9ucw=="

  # ─── Frontend (Next.js public vars) ────────────────────────────────────────────
  NEXT_PUBLIC_API_URL: "Q0hBTkdFTUU="
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: "Q0hBTkdFTUU="

---
apiVersion: v1
kind: Secret
metadata:
  name: hrms-tls
  namespace: hrms
  labels:
    app: hrms
type: kubernetes.io/tls
data:
  # Base64 encoded TLS certificate and key
  # Replace these with your actual certificate data
  # To encode: cat tls.crt | base64 -w 0
  tls.crt: REPLACE_WITH_BASE64_ENCODED_CERTIFICATE
  tls.key: REPLACE_WITH_BASE64_ENCODED_KEY
