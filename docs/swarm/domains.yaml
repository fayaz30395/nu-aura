# RuFlo DDD Bounded Contexts
# Maps the 70+ backend domain subdirectories into 5 strategic contexts.
# Used by the swarm to constrain agent scope and by the status bar's DDD counter.
#
# Source of truth for sub-domain assignments: backend/src/main/java/com/nulogic/domain/*
# Architecture scorecard reference: docs/architecture/architecture-scorecard.md

version: "1.0.0"
generated: "2026-05-14"
target_count: 5

contexts:
  - id: identity-access
    name: "Identity & Access"
    description: "Authentication, authorization, tenant boundary, user identity"
    domains:
      - auth
      - user
      - tenant
      - organization
      - platform
    primary_adrs:
      - ADR-001-multi-tenant-architecture
      - ADR-002-authentication-strategy
      - ADR-006-jwt-token-optimization
    owners: ["security-architect", "backend-dev"]
    risk_level: critical

  - id: people-lifecycle
    name: "People Lifecycle"
    description: "Employee hire-to-retire flow, documents, performance, learning"
    domains:
      - employee
      - onboarding
      - preboarding
      - probation
      - exit
      - contract
      - document
      - letter
      - performance
      - training
      - lms
      - selfservice
    primary_adrs: []
    owners: ["backend-dev", "system-architect"]
    risk_level: high

  - id: time-and-pay
    name: "Time & Pay"
    description: "Attendance, leave, shifts, payroll, compensation, tax, benefits"
    domains:
      - attendance
      - leave
      - shift
      - timetracking
      - overtime
      - payroll
      - compensation
      - tax
      - statutory
      - benefits
      - loan
      - payment
      - expense
    primary_adrs:
      - ADR-007-payroll-saga-pattern
    owners: ["backend-dev", "system-architect"]
    risk_level: critical
    notes: "Highest data sensitivity, off-by-one and timezone bugs cause direct money impact"

  - id: talent-and-engagement
    name: "Talent Acquisition & Engagement"
    description: "Recruitment funnel, referrals, BGV, recognition, surveys, wellness"
    domains:
      - recruitment
      - referral
      - bgv
      - esignature
      - recognition
      - survey
      - engagement
      - wellness
    primary_adrs:
      - ADR-008-recruitment-ats-gap-analysis
    owners: ["backend-dev"]
    risk_level: medium

  - id: ops-and-platform
    name: "Operations & Platform"
    description: "Workflow engine, notifications, webhooks, integrations, knowledge, support"
    domains:
      - workflow
      - notification
      - webhook
      - audit
      - integration
      - knowledge
      - wall
      - helpdesk
      - asset
      - travel
      - project
      - psa
      - budget
      - resourcemanagement
      - calendar
      - ai
      - analytics
      - report
      - dataimport
      - featureflag
      - customfield
      - compliance
      - common
      - event
      - announcement
      - compensation
    primary_adrs:
      - ADR-003-caching-strategy
      - ADR-004-webhook-delivery-system
      - ADR-009-database-connection-pool-sizing
    owners: ["system-architect", "perf-engineer"]
    risk_level: high
