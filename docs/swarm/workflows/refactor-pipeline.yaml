# Refactor Pipeline
# Use when: restructuring code without behavior change (extract module, rename, dedupe).
# Reference: CLAUDE.md "Agent Routing" (Refactor row).

id: refactor-pipeline
name: "Refactor: architect → coder → reviewer"
topology: hierarchical
strategy: specialized
max_agents: 3

flow: pipeline

agents:
  - name: architect
    type: system-architect
    background: true
    prompt: |
      Define the refactor scope precisely:
        - Current shape (files, dependencies, public API)
        - Target shape (proposed file layout, new boundaries)
        - Migration path (one-shot vs incremental with feature flag)
        - What MUST NOT change (public API, DB schema, observable behavior)
        - Safety net (which tests will catch regression)
      If the refactor crosses a bounded context, consult .claude-flow/domains.yaml.
      SendMessage 'coder' with the migration plan.

  - name: coder
    type: coder
    background: true
    prompt: |
      Wait for migration plan from 'architect'. Refactor strictly within scope.
      RULES:
        - No behavior change unless plan explicitly says so
        - Existing tests must pass UNCHANGED — if a test needs to change, the refactor
          is leaking behavior change; STOP and SendMessage architect for review
        - Run the full test suite at each commit boundary
      tsc --noEmit must stay green. SendMessage 'reviewer'.

  - name: reviewer
    type: reviewer
    background: true
    prompt: |
      Verify the refactor:
        - Public API surface unchanged (compare commit base vs head)
        - All tests pass with NO test edits (or only mechanical import-path updates)
        - Cyclomatic complexity and file size went down, not up
        - No dead code left behind
      Reply to Lead.

kickoff:
  to: architect
  message_template: |
    Refactor: {short description}
    Motivation: {why now — debt, scaling, new feature blocker}
    Scope: {files / packages affected}
    Out of scope: {what we explicitly will NOT touch}
