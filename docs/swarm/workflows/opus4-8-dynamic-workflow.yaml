# Opus 4.8 Dynamic Workflow
# Use when a task may require adaptive routing across feature/bug/security/perf tracks.

id: opus4-8-dynamic-workflow
name: "Opus4.8 Dynamic: classify, route, execute, validate"
topology: hierarchical-mesh
strategy: adaptive
max_agents: 7

flow: pipeline

agents:
  - name: coordinator
    type: dynamic-coordinator
    background: true
    prompt: |
      You are the Opus4.8 coordinator.

      1. Analyze the task against NU-AURA constraints in CLAUDE.md and AGENTS.md.
      2. Classify requirement type:
         - feature
         - bug
         - security
         - perf
         - refactor/reduced-scope
      3. Produce an execution matrix:
         - required tracks (arch/research/impl/qa/security/perf/review)
         - severity (P0/P1/P2)
         - tenant/security impact
         - one sentence success criteria
      4. Send your matrix to "architect" in this format:
         `ROUTE:` line-by-line with track names + rationale.
      5. If risk is P0, include explicit rollback trigger and stop criteria.

  - name: architect
    type: system-architect
    background: true
    prompt: |
      Wait for the coordinator route plan.

      Translate the requirement into a concise design for implemented files, boundaries,
      permissions (@RequiresPermission), tenant isolation checks, and test plan.
      Use `docs/swarm/domains.yaml`, MEMORY.md, and relevant architecture/ADR files.
      If the route includes security/perf, include controls and non-functional guardrails.

      SendMessage to:
      - coder with implementation scope and acceptance gates.
      - tester with required test matrix if no direct coding tasks are assigned.

  - name: coder
    type: coder
    background: true
    prompt: |
      Wait for scope from architect.

      Execute only the implementation path requested by the route:
      - feature: implement requested UX/API/service/repo changes.
      - bug: implement minimal fix aligned to research evidence.
      - security: implement remediation controls.
      - perf: implement the selected perf fix.

      Keep to project invariants: TypeScript strict, no `any`, tenant_id filters/RLS
      assumptions preserved, @RequiresPermission on new endpoints, and `frontend/lib/` Axios reuse.
      Run `cd frontend && npx tsc --noEmit` (or backend equivalent if touched).

      SendMessage to `reviewer` with touched files and open risks.

  - name: tester
    type: tester
    background: true
    prompt: |
      Wait for coder handoff if implementation happened; otherwise validate current risk matrix.

      Run required validations for each selected route:
      - feature: backend and frontend relevant suites.
      - bug: regression test first, then full impacted suite.
      - security: permission/rbac/tenant checks and abuse tests where possible.
      - perf: baseline and post-fix benchmark evidence.

      Return PASS/FAIL per gate with command output references.

  - name: security-auditor
    type: security-auditor
    background: true
    prompt: |
      Activate only if route includes security.
      Validate tenant isolation, authentication/authorization, input validation, and secret-handling changes.
      Report only P0/P1/P2 findings with file references.

  - name: reviewer
    type: reviewer
    background: true
    prompt: |
      Aggregate coordinator, tester, and any security outputs.

      Gate rules:
      - P0/P1 issues unresolved => BLOCK.
      - Gates:
        1) compile/typecheck clean
        2) test matrix complete for implemented scope
        3) security/perf evidence included when selected by coordinator
      Reply APPROVE / CHANGES_REQUESTED with explicit blockers and recovery steps.
