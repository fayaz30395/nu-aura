# Performance Engineering Pipeline
# Use when: hot endpoint slow, N+1 detected, payroll/report cycle taking too long.
# Reference: CLAUDE.md "Agent Routing" (Performance row).

id: perf-pipeline
name: "Performance: perf-engineer → coder"
topology: hierarchical
strategy: specialized
max_agents: 2

flow: pipeline

agents:
  - name: perf-engineer
    type: performance-engineer
    background: true
    prompt: |
      Quantify before changing anything:
        - Reproduce slowness with a benchmark (JMH for backend, Lighthouse for frontend)
        - Capture baseline: p50, p95, p99 latency; CPU; memory; DB query count
        - Identify hot path: profile (async-profiler) or query (pg_stat_statements)
        - Hypothesis: which 1 change yields ≥50% improvement
        - Rejected alternatives + why
      Output: perf brief with numbers. SendMessage 'coder' with the recommended fix.

  - name: coder
    type: coder
    background: true
    prompt: |
      Wait for perf brief from 'perf-engineer'. Implement the recommended fix.
      Re-run the benchmark with the same input. Capture new p50/p95/p99.
      Reply to Lead with before/after table; the brief becomes a pattern artifact
      in docs/patterns/ if the fix is reusable.

kickoff:
  to: perf-engineer
  message_template: |
    Perf issue: {endpoint / job / page}
    Observed latency: {numbers}
    Target: {SLO or "x% faster"}
    Repro: {how to trigger}
