# Nu-Aura RBAC Use Case Catalog
# Consumed by frontend/e2e/nu-rbac.spec.ts
# category: RBAC items are tested; others are ignored by the spec.
#
# expect values:
#   render         - page should load and show content (200)
#   redirect       - page should redirect away (RBAC blocked)
#   render_scoped  - page loads but shows only role-scoped data
#
# severity_on_miss: P0 = security breach, P1 = functional break, P2 = UX issue, P3 = cosmetic

use_cases:

