# Nu-Aura — Blocker Register (append-only; never delete historical blockers)
#
# Each blocker: id, severity (P0-P3), title, description, detected_at,
# detected_commit, affected_area, status, owner, root_cause, required_action,
# human_required, verification_required. Canonical statuses only.
blockers:
  - id: BLOCKER-001
    severity: P0
    title: Permission scopes flattened to ALL at runtime (broken object-level authorization)
    description: >-
      JwtAuthenticationFilter stamped every DB-hydrated permission with RoleScope.GLOBAL,
      discarding role_permissions.scope. Confirmed cross-employee PII leak on leave-requests.
    detected_at: "2026-09-24"
    detected_commit: "2b4832cb"
    affected_area: authorization
    status: IN_PROGRESS
    owner: ORCHESTRATOR
    root_cause: RoleScope.GLOBAL default in JwtAuthenticationFilter (fixed in main commit 3bcb7f31); further hardening on release/v339-security-remediation (d4e316e8).
    required_action: Execute RBAC regression tests and a live authenticated probe; require 26/26 forbidden denials.
    human_required: false
    verification_required: Backend RBAC/IDOR tests green + live RBAC matrix 26/26.
    notes: Code fix verified present (filter loads real scopes, fails closed to SELF). No execution evidence yet. See .nu-aura/evidence/798f46c8/rbac-blocker-001.md.

  - id: BLOCKER-002
    severity: P0
    title: Exposed credentials unrotated (7 credentials, UNKNOWN, live in ~85 refs)
    description: Committed root .env (introduced d5961fef / 8de12a5f) exposed JWT_SECRET, APP_SECURITY_ENCRYPTION_KEY, Spring datasource URL/user/password, MINIO_ROOT_PASSWORD, OPENAI_API_KEY (Groq), GRAFANA_ADMIN_PASSWORD.
    detected_at: "2026-09-24"
    detected_commit: "2b4832cb"
    affected_area: secrets
    status: HUMAN_REQUIRED
    owner: HUMAN
    root_cause: Secrets committed to git history and reachable from ~85 refs across two remotes.
    required_action: Rotate JWT_SECRET first, then DB creds, MinIO, Groq, Grafana. APP_SECURITY_ENCRYPTION_KEY requires a dual-key migration (do not rotate naively).
    human_required: true
    verification_required: Rotation evidence + secret scan clean on all refs.
    notes: Rotate-only is recommended; history rewrite not required once values are inert.

