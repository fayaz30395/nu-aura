      JwtAuthenticationFilter stamped every DB-hydrated permission with RoleScope.GLOBAL,
      discarding role_permissions.scope. Confirmed cross-employee PII leak on leave-requests.
    detected_at: "2026-09-24"
    detected_commit: "2b4832cb"
    affected_area: authorization
    status: VALIDATION
    owner: ORCHESTRATOR
    root_cause: RoleScope.GLOBAL default in JwtAuthenticationFilter (fixed in main 3bcb7f31; hardening d4e316e8).
    required_action: Backend RBAC regression GREEN (done). Live authenticated 26/26 forbidden-denial probe still pending a running backend (gated by BLOCKER-003).
    human_required: false
    verification_required: Backend RBAC/IDOR tests green (MET 2026-09-30) + live RBAC matrix 26/26 (PENDING).
    notes: >-
      Backend evidence: full suite 4724/0/0 + RBAC/IDOR battery 295/0/0 at 796d4a64
      (.nu-aura/evidence/796d4a64/backend-tests.md). Code-level fix verified present.
      Only the live probe remains, which requires BLOCKER-003 (hosted backend).

