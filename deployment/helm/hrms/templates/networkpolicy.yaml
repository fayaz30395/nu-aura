{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy — zero-trust east-west networking
# Gated by .Values.networkPolicy.enabled (off in default values.yaml,
# on in values-prod.yaml / values-staging.yaml).
#
# Posture (defense in depth):
#   1. Default deny ALL ingress to the namespace.
#   2. Explicit allow: ingress controller namespace -> frontend/backend.
#   3. Explicit allow: frontend pods -> backend pods on port 8080.
#   4. Explicit allow: DNS egress to kube-system for service discovery.
#
# Requires a CNI that enforces NetworkPolicy (Calico / Cilium / GKE Dataplane V2).
# GKE Standard with default CNI does NOT enforce — verify with:
#   gcloud container clusters describe <name> --format='value(networkConfig.datapathProvider)'
---
# 1) Default deny all ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hrms-default-deny-ingress
  namespace: {{ .Values.namespace }}
  labels:
    app: hrms
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress: []
---
# 2) Allow ingress controller (kube-system / ingress-nginx) -> frontend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hrms-allow-ingress-to-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: hrms
    component: frontend
spec:
  podSelector:
    matchLabels:
      app: hrms
      component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespaceLabel | quote }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 3000
---
# 3) Allow ingress controller -> backend (for /api and /actuator/health paths).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hrms-allow-ingress-to-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: hrms
    component: backend
spec:
  podSelector:
    matchLabels:
      app: hrms
      component: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespaceLabel | quote }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
---
# 4) Allow frontend pods -> backend pods (port 8080).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hrms-allow-frontend-to-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: hrms
spec:
  podSelector:
    matchLabels:
      app: hrms
      component: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: hrms
              component: frontend
      ports:
        - protocol: TCP
          port: 8080
---
# 5) Allow DNS egress to kube-system (CoreDNS) — without this, in-cluster
#    service discovery breaks and probes/CronJobs hang on DNS resolution.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hrms-allow-dns-egress
  namespace: {{ .Values.namespace }}
  labels:
    app: hrms
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
