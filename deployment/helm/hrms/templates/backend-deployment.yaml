# Backend Deployment — Helm-templated version of
# deployment/kubernetes/backend-deployment.yaml. Keep that flat manifest in
# sync (S5-B owns it for backward compat); this template lets new tenants
# `helm install` with environment-specific overrides.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-backend
  namespace: { { .Values.namespace } }
  labels:
    app: hrms
    component: backend
    version: v1
    app.kubernetes.io/managed-by: { { .Release.Service } }
    app.kubernetes.io/instance: { { .Release.Name } }
    helm.sh/chart: { { .Chart.Name } }-{{ .Chart.Version }}
spec:
  replicas: { { .Values.backend.replicas } }
  strategy:
    type: { { .Values.backend.strategy.type } }
    rollingUpdate:
      maxSurge: { { .Values.backend.strategy.maxSurge } }
      maxUnavailable: { { .Values.backend.strategy.maxUnavailable } }
  selector:
    matchLabels:
      app: hrms
      component: backend
  template:
    metadata:
      labels:
        app: hrms
        component: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      { { - if .Values.serviceAccount.enabled } }
      serviceAccountName: { { .Values.serviceAccount.backend.name } }
      { { - else } }
      serviceAccountName: { { .Values.backend.serviceAccountName } }
      { { - end } }
      { { - with .Values.imagePullSecrets } }
      imagePullSecrets:
        { { - toYaml . | nindent 8 } }
      { { - end } }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      { { - with .Values.backend.topologySpreadConstraints } }
      topologySpreadConstraints:
        { { - toYaml . | nindent 8 } }
      { { - end } }
      affinity:
        podAntiAffinity:
          { { - with .Values.backend.podAntiAffinity } }
            { { - toYaml . | nindent 10 } }
            { { - else } }
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: component
                        operator: In
                        values:
                          - backend
                  topologyKey: kubernetes.io/hostname
            { { - end } }

      # Init container to wait for dependencies
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: [ 'sh', '-c', 'until pg_isready -h ${DB_HOST} -p ${DB_PORT} -U ${DB_USER}; do echo "Waiting for PostgreSQL..."; sleep 2; done;' ]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: hrms-config
                  key: DB_HOST
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: DB_USERNAME

      containers:
        - name: backend
          # IMAGE_TAG is replaced by CI/CD pipeline (git SHA or semver).
          # :latest is forbidden by deployment/kyverno/disallow-latest-tag.yaml.
          image: "{{ .Values.imageRegistry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: { { .Values.backend.image.pullPolicy } }

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            # ── Spring Profile ─────────────────────────────────────────────────────────
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: hrms-config
                  key: SPRING_PROFILES_ACTIVE

            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: hrms-config
                  key: SERVER_PORT

            # ── Database ───────────────────────────────────────────────────────────────
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: SPRING_DATASOURCE_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: SPRING_DATASOURCE_PASSWORD

            # ── Redis ──────────────────────────────────────────────────────────────────
            - name: SPRING_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: SPRING_REDIS_HOST

            - name: SPRING_REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: SPRING_REDIS_PORT

            - name: SPRING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: SPRING_REDIS_PASSWORD

            - name: SPRING_REDIS_SSL_ENABLED
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: SPRING_REDIS_SSL_ENABLED

            # ── JWT ────────────────────────────────────────────────────────────────────
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: JWT_SECRET

            - name: JWT_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: JWT_EXPIRATION

            - name: JWT_REFRESH_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: JWT_REFRESH_EXPIRATION

            # ── Encryption ─────────────────────────────────────────────────────────────
            - name: APP_SECURITY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: APP_SECURITY_ENCRYPTION_KEY

            # ── Storage (Google Drive) ────────────────────────────────────────────────
            - name: STORAGE_PROVIDER
              value: "google-drive"

            - name: GOOGLE_DRIVE_CREDENTIALS_PATH
              value: "/etc/secrets/google-drive/credentials.json"

            - name: GOOGLE_DRIVE_ROOT_FOLDER_ID
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: GOOGLE_DRIVE_ROOT_FOLDER_ID

            # ── Email ──────────────────────────────────────────────────────────────────
            - name: MAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: MAIL_HOST

            - name: MAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: MAIL_PORT

            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: MAIL_USERNAME

            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: MAIL_PASSWORD

            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: MAIL_FROM

            # ── Google OAuth ───────────────────────────────────────────────────────────
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: GOOGLE_CLIENT_ID

            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: GOOGLE_CLIENT_SECRET

            # ── Cookie / Security ──────────────────────────────────────────────────────
            - name: COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: hrms-config
                  key: COOKIE_SECURE

            - name: COOKIE_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: COOKIE_DOMAIN

            - name: CSRF_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: hrms-config
                  key: CSRF_ENABLED

            # ── Frontend / CORS ────────────────────────────────────────────────────────
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: FRONTEND_URL

            - name: AUTH_ALLOWED_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: AUTH_ALLOWED_DOMAIN

            # ── Server error verbosity ─────────────────────────────────────────────────
            - name: SERVER_ERROR_INCLUDE_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: hrms-config
                  key: SERVER_ERROR_INCLUDE_MESSAGE

            - name: SERVER_ERROR_INCLUDE_BINDING
              valueFrom:
                configMapKeyRef:
                  name: hrms-config
                  key: SERVER_ERROR_INCLUDE_BINDING

            # ── Twilio SMS (optional) ──────────────────────────────────────────────────
            - name: TWILIO_MOCK_MODE
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: TWILIO_MOCK_MODE

            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: TWILIO_ACCOUNT_SID

            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: TWILIO_AUTH_TOKEN

            - name: TWILIO_FROM_NUMBER
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: TWILIO_FROM_NUMBER

            # ── Calendar (optional) ────────────────────────────────────────────────────
            - name: CALENDAR_MOCK_MODE
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: CALENDAR_MOCK_MODE

            - name: GOOGLE_CALENDAR_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: GOOGLE_CALENDAR_CLIENT_ID

            - name: GOOGLE_CALENDAR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: GOOGLE_CALENDAR_CLIENT_SECRET

            # ── OpenAI (optional) ──────────────────────────────────────────────────────
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: OPENAI_API_KEY

            # ── Slack (optional) ───────────────────────────────────────────────────────
            - name: SLACK_ENABLED
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: SLACK_ENABLED

            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: SLACK_WEBHOOK_URL

            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: SLACK_BOT_TOKEN

            # ── JVM ────────────────────────────────────────────────────────────────────
            - name: JAVA_OPTS
              value: { { .Values.backend.javaOpts | quote } }

          resources:
            requests:
              memory: { { .Values.backend.resources.requests.memory | quote } }
              cpu: { { .Values.backend.resources.requests.cpu | quote } }
            limits:
              memory: { { .Values.backend.resources.limits.memory | quote } }
              cpu: { { .Values.backend.resources.limits.cpu | quote } }

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: { { .Values.backend.probes.liveness.initialDelaySeconds } }
            periodSeconds: { { .Values.backend.probes.liveness.periodSeconds } }
            timeoutSeconds: { { .Values.backend.probes.liveness.timeoutSeconds } }
            failureThreshold: { { .Values.backend.probes.liveness.failureThreshold } }

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: { { .Values.backend.probes.readiness.initialDelaySeconds } }
            periodSeconds: { { .Values.backend.probes.readiness.periodSeconds } }
            timeoutSeconds: { { .Values.backend.probes.readiness.timeoutSeconds } }
            failureThreshold: { { .Values.backend.probes.readiness.failureThreshold } }

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: { { .Values.backend.probes.startup.initialDelaySeconds } }
            periodSeconds: { { .Values.backend.probes.startup.periodSeconds } }
            timeoutSeconds: { { .Values.backend.probes.startup.timeoutSeconds } }
            failureThreshold: { { .Values.backend.probes.startup.failureThreshold } }

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
            - name: google-drive-credentials
              mountPath: /etc/secrets/google-drive
              readOnly: true

      volumes:
        - name: tmp
          emptyDir: { }
        - name: logs
          emptyDir: { }
        - name: google-drive-credentials
          secret:
            secretName: hrms-google-drive-credentials

      # Wave-10 P2-6: 60s exceeds spring.lifecycle.timeout-per-shutdown-phase
      # (30s default / 45s in prod profile) so the pod has headroom for:
      #   1) the @PreDestroy STOMP shutdown broadcast (WebSocketConfig)
      #   2) the embedded Tomcat finishing in-flight HTTP requests
      #   3) Hikari / Lettuce / Kafka producers closing cleanly
      # Setting this too low (e.g. the old 30s) causes K8s to SIGKILL mid-flush,
      # leaving STOMP clients to retry storm against the next-ready pod.
      terminationGracePeriodSeconds: 60
