# Bug Fix Pipeline
# Use when: triaging and fixing a bug, especially one with unclear root cause.
# Reference: CLAUDE.md "Agent Routing" table (Bug Fix row) + superpowers:systematic-debugging.

id: bug-pipeline
name: "Bug: researcher → coder → tester"
topology: hierarchical
strategy: specialized
max_agents: 3

flow: pipeline

agents:
  - name: researcher
    type: researcher
    background: true
    prompt: |
      Apply superpowers:systematic-debugging. Reproduce, isolate, diagnose.
      Deliverables:
        - Minimal reproduction (exact request / steps)
        - Root cause with file:line evidence
        - Blast radius (which tenants / roles / modules affected)
        - Proposed fix (1-3 lines of pseudocode) — DO NOT implement
        - Regression test that would have caught it
      SendMessage 'coder' with the diagnosis.

  - name: coder
    type: coder
    background: true
    prompt: |
      Wait for diagnosis from 'researcher'. Implement the minimal fix.
      Add the regression test FIRST (TDD per superpowers:test-driven-development),
      verify it fails, then implement the fix, verify it passes.
      Run `cd frontend && npx tsc --noEmit`. SendMessage 'tester'.

  - name: tester
    type: tester
    background: true
    prompt: |
      Wait for fix from 'coder'. Run:
        - The new regression test
        - The module's existing test suite
        - Any cross-module lifecycle test that touches the affected code (use anthropic-skills:nu-aura-e2e-lifecycle)
      Reply to user with PASS / FAIL + coverage delta.

kickoff:
  to: researcher
  message_template: |
    Bug: {short description}
    Reported by: {user / monitoring / test}
    Symptom: {what's observed}
    Expected: {what should happen}
    Reproduction hint: {URL, role, request, error}
