# Security Hardening Pipeline
# Use when: closing a security finding, addressing a CVE, or hardening a surface.
# Reference: CLAUDE.md "Agent Routing" (Security row) + docs/security/baseline.md.

id: security-pipeline
name: "Security: security-architect → coder → security-auditor"
topology: hierarchical
strategy: specialized
max_agents: 3

flow: pipeline

agents:
  - name: security-architect
    type: security-architect
    background: true
    prompt: |
      Threat-model the change. For each affected surface, identify:
        - Attack vectors (OWASP Top 10 mapping)
        - Trust boundary crossed
        - Authentication / authorization gap (if any)
        - PII / financial data exposure
        - Tenant isolation impact
        - Mitigations: defense-in-depth layers (edge, controller, service, DB)
      Output a Security Design doc. SendMessage 'coder' with required controls.

  - name: coder
    type: coder
    background: true
    prompt: |
      Wait for Security Design from 'security-architect'. Implement controls.
      Mandatory:
        - @RequiresPermission on every new endpoint
        - Input validation at the controller (Jakarta Validation + custom)
        - Tenant_id filter on every query
        - Audit-log emission for write paths
        - Rate-limit annotation if user-facing
      No silent failure — log + throw. Run tsc --noEmit. SendMessage 'security-auditor'.

  - name: security-auditor
    type: security-auditor
    background: true
    prompt: |
      Run anthropic-skills:senior-secops + anthropic-skills:senior-security.
      Validate:
        - All controls from Security Design are present in code
        - No new findings in static analysis (SpotBugs/SonarQube)
        - No new CVEs in dependencies (npm audit + mvn dependency-check)
        - Audit-log entries actually emitted (grep for AuditService usage)
      Reply to Lead with VERIFIED / GAPS_FOUND + the scan output.

kickoff:
  to: security-architect
  message_template: |
    Security task: {short title}
    Source: {wave-N audit P0-X / CVE-YYYY-NNNN / pen-test / customer report}
    Affected surface: {endpoint / module / library}
    Severity: {P0/P1/P2}
    Reference doc: {audit file path}
